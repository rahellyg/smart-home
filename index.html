<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStart - אקדמיה לעתיד הטכנולוגי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #e0f2fe 100%);
        }
        
        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.985) translateY(6px);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        visibility 0.8s linear;
            will-change: opacity, transform, visibility;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .inner-media {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }
        .inner-media.active {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-bar-fill {
            transition: width 0.1s linear;
        }

        /* --- אנימציות לחיישנים הויזואליים --- */
        @keyframes wave {
            0% { transform: translateX(0); }
            50% { transform: translateX(-25%); }
            100% { transform: translateX(0); }
        }
        .animate-wave {
            animation: wave 4s ease-in-out infinite;
        }

        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-radar {
            animation: radar-sweep 3s linear infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between text-slate-800 selection:bg-pink-500 selection:text-white overflow-hidden">

    <header class="w-full py-2.5 px-4 md:px-8 flex items-center justify-between bg-white/90 backdrop-blur-md border-b border-purple-100 shrink-0 shadow-sm z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-2xl bg-white flex items-center justify-center p-1 shadow-lg border border-indigo-200 shrink-0">
                <img id="headerLogoImg" src="img/logo.png" alt="SmartStart Logo" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/150?text=SmartStart'" />
            </div>
            <div>
                <h1 class="text-base md:text-xl font-black tracking-wider text-indigo-950 leading-tight">SMARTSTART</h1>
                <p class="text-[10px] md:text-xs text-pink-600 font-bold tracking-wide">FUTURE TECH LEADERS</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-3">
            <div class="hidden sm:flex items-center gap-2 bg-gradient-to-r from-pink-50 to-purple-50 px-3 py-1.5 rounded-full border border-pink-200 text-xs text-purple-800 font-bold shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-pink-500 animate-ping"></span>
                <span>ערב הורים ורישום 2026</span>
            </div>

            <button id="toggleEditBtn" onclick="toggleEditMode()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all shadow-md flex items-center gap-1.5 cursor-pointer active:scale-95">
                <i class="fa-solid fa-pen-to-square text-pink-400"></i>
                <span id="editBtnText">מצב עריכה</span>
            </button>

            <button id="pausePlayBtn" onclick="togglePlay()" class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 hover:opacity-95 text-white px-3.5 py-1.5 rounded-xl text-xs md:text-sm font-bold transition-all shadow-md shadow-purple-500/25 flex items-center gap-2 cursor-pointer active:scale-95">
                <i id="playPauseIcon" class="fa-solid fa-pause"></i>
                <span id="playPauseText" class="hidden md:inline">השהה מצגת</span>
            </button>
        </div>
    </header>

    <div class="w-full bg-purple-100/50 h-1.5 shrink-0 relative overflow-hidden">
        <div id="progressBar" class="h-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 w-0 progress-bar-fill"></div>
    </div>

    <main class="flex-grow flex items-center justify-center p-3 md:p-6 relative overflow-hidden">
        <div id="slidesViewport" class="w-full h-full max-w-7xl mx-auto relative flex items-center justify-center">
            </div>

        <div id="editDrawer" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex justify-end">
            <div class="w-full max-w-lg bg-white h-full shadow-2xl flex flex-col p-5 md:p-6 overflow-y-auto">
                <div class="flex items-center justify-between border-b pb-4 mb-4 border-slate-200">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-photo-film text-purple-600 text-xl"></i>
                        <h3 class="text-xl font-black text-slate-900">ניהול מדיה לשקפים</h3>
                    </div>
                    <button onclick="toggleEditMode()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold transition">✕</button>
                </div>

                <div class="space-y-4 flex-grow">
                    <div>
                        <label class="block text-
