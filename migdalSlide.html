<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStart - אקדמיה לעתיד הטכנולוגי</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Heebo -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* מניעת גלילה לחלוטין */
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #e0f2fe 100%);
        }
        
        /* --- אנימציית מעבר אלגנטית (Crossfade) --- */
        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.985) translateY(6px);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        visibility 0.8s linear;
            will-change: opacity, transform, visibility;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* --- סליידר מדיה פנימי --- */
        .inner-media {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }
        .inner-media.active {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-bar-fill {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between text-slate-800 selection:bg-pink-500 selection:text-white overflow-hidden">

    <!-- Progress Bar -->

                <div class="flex items-center justify-between border-b pb-4 mb-4 border-slate-200">

    </main>

    <!-- Footer Controls -->

            <button onclick="nextSlide()" class="bg-purple-100 hover:bg-purple-200 border border-purple-300 text-purple-900 w-9 h-9 md:w-10 md:h-10 rounded-xl flex items-center justify-center transition-all cursor-pointer shadow-sm active:scale-95 font-bold" aria-label="שקף הבא">

        </div>

                features: [
                    { text: "תכנון וניהול פרויקטים מהרעיון למוצר", icon: "fa-solid fa-rocket" },
                    { text: "שימוש ב-AI להתאמת חוויה בבית חכם", icon: "fa-solid fa-house-signal" },
                    { text: "עבודה עם חיישני אור, לחות ואלקטרוניקה", icon: "fa-solid fa-gauge-high" },
                    { text: "פיתוח אפליקציות וחיבור בזמן אמת לענן", icon: "fa-solid fa-mobile-screen-button" }
                ],

                    "img/robot/rr3.jpeg",
                    "img/robot/rr4.jpeg",
                    "img/robot/rr5.jpeg",
                    "img/robot/rr6.jpeg",
                    "img/robot/rr7.jpeg"
                ]
            }
        ];

        let currentIndex = 0;
        let isPlaying = true;
        let progressInterval = null;
        let progressVal = 0;
        const SLIDE_DURATION = 20000;
        let innerMediaIntervals = {};

        function isVideoUrl(url) {
            return url.match(/\.(mp4|webm|ogg|mov)($|\?)/i);
        }

        function initSlidesDOM() {
            const viewport = document.getElementById('slidesViewport');
            const indicators = document.getElementById('indicators');
            viewport.innerHTML = '';
            indicators.innerHTML = '';

            slidesData.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.id = `slide-${index}`;
                
                // שינוי עיקרי: הגדרת grid התואם בדיוק לגובה החלון ומניעת חריגה
                slideEl.className = `slide grid grid-cols-1 md:grid-cols-2 bg-white/95 backdrop-blur-2xl border-2 border-purple-200/80 rounded-3xl p-4 md:p-6 shadow-2xl gap-4 md:gap-6 items-stretch max-h-full overflow-hidden ${index === currentIndex ? 'active' : ''}`;
                
                const featuresHTML = slide.features.map(f => `
                    <div class="bg-purple-50/90 p-2 rounded-xl border border-purple-200 flex items-center gap-2 shadow-sm text-xs font-semibold text-slate-800">
                        <span class="w-5 h-5 rounded-lg bg-gradient-to-tr from-pink-500 to-purple-600 text-white text-[10px] flex items-center justify-center shrink-0 shadow-sm">
                            <i class="${f.icon}"></i>
                        </span>
                        <span class="truncate">${f.text}</span>
                    </div>
                `).join('');

                let mediaHTML = '';
                if (slide.media && slide.media.length > 0) {
                    slide.media.forEach((mUrl, mIdx) => {
                        const activeClass = mIdx === 0 ? 'active' : '';
                        if (isVideoUrl(mUrl)) {
                            mediaHTML += `
                                <div class="inner-media ${activeClass} absolute inset-0 w-full h-full p-1" data-media-idx="${mIdx}">
                                    <video src="${mUrl}" autoplay loop muted playsinline class="w-full h-full object-cover rounded-xl shadow-inner"></video>
                                </div>
                            `;
                        } else {
                            mediaHTML += `
                                <div class="inner-media ${activeClass} absolute inset-0 w-full h-full flex items-center justify-center p-1" data-media-idx="${mIdx}">
                                    <img src="${mUrl}" alt="Media ${mIdx+1}" class="w-full h-full object-cover rounded-xl shadow-sm" onerror="this.onerror=null; this.src='img/logo.png';" />
                                </div>
                            `;
                        }
                    });
                } else {
                    mediaHTML = `
                        <div class="inner-media active absolute inset-0 w-full h-full flex items-center justify-center p-4">
                            <img src="img/logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/300?text=SmartStart'" />
                        </div>
                    `;
                }

                slideEl.innerHTML = `
                    <!-- עמודת תוכן -->
                    <div class="space-y-2 md:space-y-3 text-right flex flex-col justify-center h-full overflow-hidden">
                        <div class="flex flex-wrap items-center gap-2 shrink-0">
                            <span class="bg-pink-100 text-pink-900 px-3 py-0.5 rounded-full text-xs font-black border border-pink-200">${slide.badge1}</span>
                            <span class="bg-purple-100 text-purple-900 px-3 py-0.5 rounded-full text-xs font-black border border-purple-200">${slide.badge2}</span>
                        </div>
                        <h2 class="text-lg md:text-2xl font-black text-slate-900 leading-snug shrink-0">${slide.title}</h2>
                        <p class="text-slate-600 text-xs md:text-sm leading-relaxed overflow-y-auto max-h-[140px] md:max-h-none">${slide.desc}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-700 pt-1 shrink-0">
                            ${featuresHTML}
                        </div>
                    </div>

                    <!-- עמודת מדיה -->
                    <div class="w-full h-full flex justify-center items-center min-h-[220px] md:min-h-0">
                        <div class="w-full h-full relative rounded-2xl md:rounded-3xl bg-gradient-to-tr from-indigo-950 via-slate-900 to-purple-950 border-4 border-white shadow-xl overflow-hidden">
                            ${mediaHTML}
                        </div>
                    </div>
                `;

                viewport.appendChild(slideEl);

                const dot = document.createElement('button');
                dot.id = `dot-${index}`;
                dot.className = `h-2.5 md:h-3 rounded-full transition-all duration-500 cursor-pointer ${index === currentIndex ? 'bg-pink-600 w-6 md:w-8' : 'bg-purple-200 w-2.5 md:w-3'}`;
                dot.onclick = () => goToSlide(index);
                indicators.appendChild(dot);

                /* תחלופה אוטומטית בין תמונות הקורס הנוכחי במידה ויש יותר מאחת */
                if (slide.media && slide.media.length > 1) {
                    let currentMediaIdx = 0;
                    innerMediaIntervals[index] = setInterval(() => {
                        if (index === currentIndex && isPlaying) {
                            const mediaItems = slideEl.querySelectorAll('.inner-media');
                            if (mediaItems.length > 0) {
                                mediaItems[currentMediaIdx].classList.remove('active');
                                currentMediaIdx = (currentMediaIdx + 1) % mediaItems.length;
                                mediaItems[currentMediaIdx].classList.add('active');
                            }
                        }
                    }, 4000);
                }
            });

            resetProgress();
        }

        function updateActiveSlideClass() {
            slidesData.forEach((_, idx) => {
                const slideEl = document.getElementById(`slide-${idx}`);
                const dotEl = document.getElementById(`dot-${idx}`);
                
                if (slideEl) {
                    if (idx === currentIndex) {
                        slideEl.classList.add('active');
                    } else {
                        slideEl.classList.remove('active');
                    }
                }

                if (dotEl) {
                    if (idx === currentIndex) {
                        dotEl.className = 'h-2.5 md:h-3 rounded-full transition-all duration-500 cursor-pointer bg-pink-600 w-6 md:w-8';
                    } else {
                        dotEl.className = 'h-2.5 md:h-3 rounded-full transition-all duration-500 cursor-pointer bg-purple-200 w-2.5 md:w-3';
                    }
                }
            });

            resetProgress();
        }

        function goToSlide(index) {
            if (index === currentIndex) return;
            currentIndex = index;
            updateActiveSlideClass();
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % slidesData.length;
            updateActiveSlideClass();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + slidesData.length) % slidesData.length;
            updateActiveSlideClass();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('playPauseIcon');
            const text = document.getElementById('playPauseText');
            
            if (isPlaying) {
                icon.className = 'fa-solid fa-pause';
                text.innerText = 'השהה מצגת';
                startAutoPlay();
            } else {
                icon.className = 'fa-solid fa-play';
                text.innerText = 'הפעל מצגת';
                stopAutoPlay();
            }
        }

        function resetProgress() {
            progressVal = 0;
            document.getElementById('progressBar').style.width = '0%';
        }

        function startAutoPlay() {
            stopAutoPlay();
            if (!isPlaying) return;

            progressInterval = setInterval(() => {
                progressVal += (100 / (SLIDE_DURATION / 100));
                document.getElementById('progressBar').style.width = `${Math.min(progressVal, 100)}%`;
                
                if (progressVal >= 100) {
                    nextSlide();
                }
            }, 100);
        }

        function stopAutoPlay() {
            clearInterval(progressInterval);
        }

        /* --- מצב עריכה למדיה --- */
        function toggleEditMode() {
            const drawer = document.getElementById('editDrawer');
            drawer.classList.toggle('hidden');
            if (!drawer.classList.contains('hidden')) {
                populateSlideSelectOptions();
                loadSlideMediaToEdit();
            }
        }

        function populateSlideSelectOptions() {
            const select = document.getElementById('editSlideSelect');
            select.innerHTML = '';
            slidesData.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `שקף ${idx + 1}: ${s.badge1} - ${s.badge2}`;
                if (idx === currentIndex) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function loadSlideMediaToEdit() {
            const slideIdx = document.getElementById('editSlideSelect').value;
            const mediaList = slidesData[slideIdx].media || [];
            const container = document.getElementById('mediaInputsList');
            container.innerHTML = '';

            mediaList.forEach((url) => {
                addMediaInputRow(url);
            });

            if (mediaList.length === 0) {
                addMediaInputRow("img/logo.png");
            }
        }

        function addMediaInputRow(urlValue = '') {
            const container = document.getElementById('mediaInputsList');
            const rowsCount = container.querySelectorAll('.media-input-row').length;
            if (rowsCount >= 10) {
                alert("ניתן להוסיף עד 10 תמונות/סרטונים לשקף.");
                return;
            }

            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 media-input-row';
            row.innerHTML = `
                <input type="text" value="${urlValue}" class="media-url-input flex-grow p-2 rounded-xl border border-slate-300 text-xs font-mono dir-ltr text-left focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="img/course_1.jpg או https://...">
                <button onclick="this.parentElement.remove()" class="w-8 h-8 rounded-xl bg-red-100 text-red-600 hover:bg-red-200 flex items-center justify-center shrink-0 font-bold transition">✕</button>
            `;
            container.appendChild(row);
        }

        function addMediaInput() {
            addMediaInputRow('');
        }

        function saveSlideMedia() {
            const slideIdx = document.getElementById('editSlideSelect').value;
            const inputs = document.querySelectorAll('.media-url-input');
            const newMedia = [];

            inputs.forEach(input => {
                const val = input.value.trim();
                if (val) newMedia.push(val);
            });

            slidesData[slideIdx].media = newMedia;
            Object.values(innerMediaIntervals).forEach(clearInterval);
            innerMediaIntervals = {};
            initSlidesDOM();
            toggleEditMode();
        }

        window.onload = () => {
            initSlidesDOM();
            startAutoPlay();
        };
    </script>
</body>
</html>
