<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStart - אקדמיה לעתיד הטכנולוגי</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Heebo -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            overflow: hidden; /* מניעת גלילה לגמרי עבור מסך טלוויזיה */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
        }
        
        .slide {
            display: none;
            opacity: 0;
            transition: opacity 0.7s ease-in-out, transform 0.7s ease-in-out;
            transform: scale(0.96);
        }
        .slide.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .floating-anim {
            animation: floatAnim 5s ease-in-out infinite;
        }

        .progress-bar-fill {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-6 md:p-10 selection:bg-pink-500 selection:text-white select-none">

    <!-- Header -->
    <header class="w-full flex justify-between items-center bg-slate-900/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-5 px-8 shadow-2xl z-50">
        <div class="flex items-center gap-6">
            <div class="w-20 h-20 rounded-2xl bg-white flex items-center justify-center p-2 shadow-xl border-2 border-indigo-400 shrink-0">
                <img id="headerLogoImg" src="logo.png" alt="SmartStart Logo" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/150'" />
            </div>
            <div>
                <h1 class="text-3xl md:text-4xl font-black tracking-wider text-white leading-tight">SMARTSTART</h1>
                <p class="text-base md:text-lg text-pink-400 font-bold tracking-widest uppercase">Future Tech Leaders</p>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 bg-pink-500/20 px-6 py-3 rounded-2xl border border-pink-500/40 text-lg md:text-xl text-pink-300 font-extrabold shadow-lg">
                <span class="w-4 h-4 rounded-full bg-pink-500 animate-ping"></span>
                <span>הרשמה לשנת 2026 בעיצומה</span>
            </div>

            <button id="toggleEditBtn" onclick="toggleEditMode()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-5 py-3 rounded-2xl text-base font-bold transition shadow-md flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-pen-to-square text-pink-400"></i>
                <span>עריכה</span>
            </button>

            <button id="pausePlayBtn" onclick="togglePlay()" class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white px-6 py-3 rounded-2xl text-base md:text-lg font-bold transition shadow-lg shadow-purple-500/30 flex items-center gap-3 cursor-pointer">
                <i id="playPauseIcon" class="fa-solid fa-pause"></i>
                <span id="playPauseText">השהה</span>
            </button>
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="w-full bg-slate-800/80 h-3 rounded-full mt-4 overflow-hidden border border-slate-700/50 shadow-inner">
        <div id="progressBar" class="h-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-400 w-0 progress-bar-fill"></div>
    </div>

    <!-- Main Viewport -->
    <main class="flex-grow flex items-center justify-center my-4 relative">
        <div id="slidesViewport" class="w-full h-full max-w-[1700px] mx-auto relative flex items-center justify-center">
            <!-- Dynamic Slides Render Here -->
        </div>

        <!-- Edit Modal -->
        <div id="editDrawer" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex justify-center items-center">
            <div class="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-3xl p-8 shadow-2xl flex flex-col gap-6 text-right">
                <div class="flex items-center justify-between border-b border-slate-700 pb-4">
                    <h3 class="text-2xl font-black text-white">הגדרת תמונת הלוגו</h3>
                    <button onclick="toggleEditMode()" class="text-slate-400 hover:text-white text-2xl font-bold">✕</button>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">נתיב קובץ הלוגו או URL:</label>
                    <input type="text" id="editLogoInput" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-600 text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 dir-ltr text-left" placeholder="logo.png">
                </div>
                <button onclick="updateLogoUrl()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition">
                    עדכן תמונה
                </button>
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full bg-slate-900/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-4 px-8 flex items-center justify-between shadow-2xl z-50">
        <div class="flex items-center gap-4">
            <button onclick="prevSlide()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center transition shadow-md active:scale-95 text-xl" aria-label="שקף קודם">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button onclick="nextSlide()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center transition shadow-md active:scale-95 text-xl" aria-label="שקף הבא">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>

        <div class="flex items-center gap-3" id="indicators"></div>

        <div class="text-slate-300 font-bold text-lg flex items-center gap-3">
            <span class="w-3.5 h-3.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>מעבר אוטומטי בלופ | SmartStart 2026</span>
        </div>
    </footer>

    <script>
        let logoImgUrl = "logo.png";

        const slidesData = [
            {
                badge1: "SmartStart",
                badge2: "אקדמיה לעתיד הטכנולוגי",
                title: 'מפתחים את <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300">מנהיגי הטכנולוגיה</span> של המחר',
                desc: "הצטרפו לתוכנית העשרה מתקדמת המיועדת לפיתוח כישורים טכנולוגיים, חשיבה יצירתית ופתרון בעיות באמצעות פרויקטים מעשיים ואינטראקטיביים. אנו מציעים מסלולי לימוד מרתקים המשלבים תכנות, בניית רובוטים וטכנולוגיות מתקדמות כמו IoT, בינה מלאכותית, פיתוח אפליקציות ועוד, תוך שימוש בשיטת Project-Based Learning.",
                features: [
                    "למידה מעשית מבוססת פרויקטים (PBL)",
                    "שילוב תכנות, רובוטיקה ובינה מלאכותית (AI)",
                    "פיתוח חשיבה יצירתית, אלגוריתמית ופתרון בעיות",
                    "חיבור מעשי וישיר לעולם העבודה המעודכן"
                ]
            },
            {
                badge1: "כיתות ד' – ו'",
                badge2: "15 מפגשים",
                title: '<span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300">AI-MAKERS</span> (מייקרים מונעי AI)',
                desc: "בואו להוביל את המהפכה הטכנולוגית הבאה! כאן לא רק לומדים תיאוריה – בונים, מפרקים ויוצרים מערכות חכמות מאפס, תוך שימוש בכוחה של הבינה המלאכותית (AI) להעניק למערכות יכולת למידה, זיהוי ותגובה בזמן אמת.",
                features: [
                    "יצירה עצמאית (DIY Tech): תכנון, חיישנים ומנועים",
                    "בינה מלאכותית: למידת מכונה וזיהוי סביבה בזמן אמת",
                    "למידה מבוססת פרויקטים (PBL) לבניית תוצרים פועלים",
                    "טכנולוגיות: App Inventor, Arduino/ESP32, Firebase"
                ]
            },
            {
                badge1: "כיתות ד' – ו'",
                badge2: "15 מפגשים",
                title: 'מאסטרים ב-<span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300">Generative AI</span>',
                desc: "קורס המפתח חשיבה אלגוריתמית ויצירתיות טכנולוגית. התלמידים יתנסו בתכנון ופיתוח אפליקציות אינטראקטיביות מורכבות ב-App Inventor של MIT, החל משלב ה-UX/UI ועד להטמעה בטלפון הנייד.",
                features: [
                    "שימוש בחיישנים: GPS, מד תאוצה ומצלמה",
                    "שילוב מולטימדיה וממשקים חיצוניים (API)",
                    "אחסון וניהול נתונים בזמן אמת בענן של Google",
                    "שילוב יכולות AI: זיהוי עצמים, דיבור והבעות פנים"
                ]
            },
            {
                badge1: "גן חובה עד כיתות א' – ג'",
                badge2: "מסלול יסודות",
                title: '<span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300">מהנדסים צעירים</span> (WeDo 2.0)',
                desc: "הצעד הראשון של ילדיכם בעולם ההנדסה המודרנית! באמצעות סביבת הלמידה החווייתית WeDo 2.0 של חברת לגו, התלמידים יחקרו עקרונות פיזיקליים, ירכיבו רובוטים מתוחכמים ויפתחו מיומנויות תכנות בסיסיות.",
                features: [
                    "בניית רובוטים מלגו עם מנועים וחיישנים אינטראקטיביים",
                    "תכנות בלוקים חזותי בסביבת WeDo 2.0 הידידותית",
                    "חקר עקרונות הפיזיקה, המדעים ופיתוח מוטוריקה עדינה",
                    "פרויקטים בנושאי חילוץ והצלה, בעלי חיים וסביבה"
                ]
            },
            {
                badge1: "כיתות ד' – ו'",
                badge2: "מסלול שנתי",
                title: 'חוקרי <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300">I.O.T ובינה מלאכותית</span>',
                desc: "מסלול יוקרתי המקנה ארגז כלים טכנולוגי מהשורה הראשונה. התלמידים ילמדו להפוך רעיון למוצר עובד – מתכנות אפליקציות לבעלי מוגבלויות ועד ניהול צריכת המים והחשמל בבתים חכמים, תוך שילוב Arduino, ESP32, Firebase ו-AI.",
                features: [
                    "תכנון וניהול פרויקטים מקיפים משלב הרעיון ועד המוצר",
                    "שימוש ב-AI להתאמת חוויית המשתמש בבית החכם",
                    "עבודה עם חיישני אור, לחות, טמפרטורה ואלקטרוניקה",
                    "פיתוח אפליקציות וחיבור בזמן אמת למאגרי ענן"
                ]
            }
        ];

        let currentIndex = 0;
        let isPlaying = true;
        let progressInterval = null;
        let progressVal = 0;
        const SLIDE_DURATION = 8000;

        function renderSlides() {
            const viewport = document.getElementById('slidesViewport');
            const indicators = document.getElementById('indicators');
            viewport.innerHTML = '';
            indicators.innerHTML = '';

            slidesData.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = `slide absolute inset-0 flex flex-col lg:flex-row items-center justify-between bg-slate-900/90 backdrop-blur-2xl border-2 border-slate-700/80 rounded-3xl p-8 md:p-12 shadow-2xl gap-8 ${index === currentIndex ? 'active' : ''}`;
                
                const featuresHTML = slide.features.map(f => `
                    <div class="bg-slate-800/90 p-4 md:p-5 rounded-2xl border border-slate-700 flex items-center gap-4 shadow-lg">
                        <span class="w-8 h-8 rounded-xl bg-pink-500 text-white text-base font-extrabold flex items-center justify-center shrink-0">✓</span>
                        <span class="text-base md:text-xl font-bold text-slate-100">${f}</span>
                    </div>
                `).join('');

                slideEl.innerHTML = `
                    <div class="w-full lg:w-7/12 space-y-6 text-right">
                        <div class="flex flex-wrap items-center gap-3">
                            <span class="bg-pink-500/20 text-pink-300 px-5 py-2 rounded-2xl text-base md:text-lg font-black border border-pink-500/40">${slide.badge1}</span>
                            <span class="bg-purple-500/20 text-purple-300 px-5 py-2 rounded-2xl text-base md:text-lg font-black border border-purple-500/40">${slide.badge2}</span>
                        </div>
                        <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-white leading-tight">${slide.title}</h2>
                        <p class="text-slate-300 text-lg md:text-2xl leading-relaxed font-normal">${slide.desc}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            ${featuresHTML}
                        </div>
                    </div>
                    <div class="w-full lg:w-5/12 flex justify-center items-center">
                        <div class="w-72 h-72 md:w-96 md:h-96 bg-gradient-to-tr from-indigo-900 via-slate-800 to-pink-950 rounded-3xl flex items-center justify-center border-4 border-slate-600 shadow-2xl floating-anim p-6">
                            <img src="${logoImgUrl}" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/200'" />
                        </div>
                    </div>
                `;

                viewport.appendChild(slideEl);

                const dot = document.createElement('button');
                dot.className = `h-4 rounded-full transition-all cursor-pointer ${index === currentIndex ? 'bg-pink-500 w-12' : 'bg-slate-700 w-4'}`;
                dot.onclick = () => goToSlide(index);
                indicators.appendChild(dot);
            });

            resetProgress();
        }

        function goToSlide(index) {
            currentIndex = index;
            renderSlides();
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % slidesData.length;
            renderSlides();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + slidesData.length) % slidesData.length;
            renderSlides();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('playPauseIcon');
            const text = document.getElementById('playPauseText');
            
            if (isPlaying) {
                icon.className = 'fa-solid fa-pause';
                text.innerText = 'השהה';
                startAutoPlay();
            } else {
                icon.className = 'fa-solid fa-play';
                text.innerText = 'הפעל';
                stopAutoPlay();
            }
        }

        function resetProgress() {
            progressVal = 0;
            document.getElementById('progressBar').style.width = '0%';
        }

        function startAutoPlay() {
            stopAutoPlay();
            if (!isPlaying) return;

            progressInterval = setInterval(() => {
                progressVal += (100 / (SLIDE_DURATION / 100));
                document.getElementById('progressBar').style.width = `${Math.min(progressVal, 100)}%`;
                
                if (progressVal >= 100) {
                    nextSlide();
                }
            }, 100);
        }

        function stopAutoPlay() {
            clearInterval(progressInterval);
        }

        function toggleEditMode() {
            document.getElementById('editDrawer').classList.toggle('hidden');
        }

        function updateLogoUrl() {
            const inputVal = document.getElementById('editLogoInput').value;
            if (inputVal) {
                logoImgUrl = inputVal;
                document.getElementById('headerLogoImg').src = inputVal;
                renderSlides();
                toggleEditMode();
            }
        }

        window.onload = () => {
            renderSlides();
            startAutoPlay();
        };
    </script>
</body>
</html>
